name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py

  installer:
    # /bin/bash on macOS is still 3.2, so the installer and every install hook must run on it.
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: installer smoke test
        run: |
          /bin/bash --version | head -n1
          export HOME="$(mktemp -d)"
          /bin/bash ./install.sh --everything --all
          for s in skills/*/; do
            s="$(basename "$s")"
            for t in "$HOME/.claude/skills" "$HOME/.codex/skills" "$HOME/.gemini/config/skills" "$HOME/.kiro/skills"; do
              test -f "$t/$s/SKILL.md"
              test ! -e "$t/$s/README.md"
            done
          done
          /bin/bash ./install.sh --everything --uninstall

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is the oldest Python the skills promise; newer runner images no longer carry it.
          - os: ubuntu-24.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: run every skill's tests
        run: |
          status=0
          for d in tests/*/; do
            echo "::group::$d"
            python -m unittest discover -s "$d" -v || status=1
            echo "::endgroup::"
          done
          exit $status